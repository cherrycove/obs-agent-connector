name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Verify formatting
        run: |
          gofmt -w $(find cmd internal -type f -name '*.go')
          git diff --exit-code

      - name: Run tests
        run: go test ./...

      - name: Run vet
        run: go vet ./...

      - name: Build local binary
        run: go build -o obs-agent-connector ./cmd/obs-agent-connector

  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build release artifacts
        run: ./scripts/build-release.sh

  windows-grok-hook-smoke:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run Grok Windows Hook shell tests
        run: go test ./internal/install -run '^TestGrokWindowsHookCommandExecutes' -count=1
